# =====================================================================
#  WallyCull settings (defaults)
#
#  Don't edit this file: updates replace it. Put the values you want to
#  change into %LOCALAPPDATA%\WallyCull\settings.yaml instead, with the
#  same structure, e.g.
#
#      classification:
#        strictness: 0.7
#
#  After a change, run "Analyze" again: the expensive measurements come
#  from the cache, only the classification is computed again.
# =====================================================================

general:
  # Number of parallel processes. 0 = automatic (CPU cores minus 2, so the PC stays responsive).
  workers: 0
  # Run with low priority in the background (recommended).
  low_priority: true
  # Images are scaled to this long edge (pixels) for the measurements.
  # All sharpness thresholds below refer to this size.
  analysis_size: 1600
  # Also check sharpness at 100% from the full resolution (full-size camera JPG or a fully
  # developed RAW). Slower, but essential for large wall art. false = small preview only (fast).
  full_resolution: true
  # Sharpness is always measured at this image size (long edge in pixels;
  # 4000 px is about 50 cm print width at 200 dpi).
  sharpness_reference_size: 4000
  # Always fully develop RAW files instead of using the embedded camera JPG.
  # Unnecessary for the X-T5 (its preview is 4416 px), and much slower.
  develop_raw: false
  # Size of the preview images in the report (pixels, long edge).
  preview_size: 480

files:
  raw: [.raf, .cr2, .cr3, .nef, .arw, .dng, .orf, .rw2, .pef]
  image: [.jpg, .jpeg, .png, .tif, .tiff, .webp]
  # Where "Import from memory card" copies to. Empty = Pictures\WallyCull\<date>_<card folder>.
  import_folder: ""
  # Sidecar files are not analyzed, but always moved together with their image.
  sidecar: [.xmp, .pp3, .dop]
  # These folders are skipped when scanning (folders starting with "." always are).
  ignored_folders: [_rejected, _aussortiert, "$RECYCLE.BIN", "System Volume Information"]
  # Name of the folder for rejected images (inside the photo folder).
  rejected_folder: _rejected

quality:
  # Sharpness = Laplacian variance on the subject (face or most salient area).
  # Below "blurry" the subject counts as blurry, from "sharp" as fully sharp; smooth blend in between.
  sharpness_blurry: 25
  sharpness_sharp: 250
  # Faces are smooth and have fewer edges: their value is multiplied by this factor.
  face_factor: 2.5

  # Fine detail: edge width in pixels at the sharpest spots of the subject, measured at
  # sharpness_reference_size (about 1 = tack sharp, 2 = visibly soft, 3+ = blurry).
  # Full score up to "sharp", zero from "blurry".
  edge_width_sharp: 1.1
  edge_width_blurry: 2.0

  # Overexposure: share of blown-out pixels (0.02 = 2%).
  overexposed_ok: 0.02
  overexposed_bad: 0.20
  # Underexposure: share of crushed pixels.
  underexposed_ok: 0.10
  underexposed_bad: 0.55
  # More generous limit for detected night shots.
  underexposed_bad_night: 0.92

  # Noise: estimated standard deviation in smooth areas.
  noise_ok: 2.0
  noise_bad: 7.0

  # Camera shake: edges along the motion are this many times wider than across it ...
  shake_ratio: 2.0
  # ... the widest direction is at least this wide (pixels), otherwise it is just image structure ...
  shake_min_width: 1.8
  # ... and the subject is visibly soft overall (edge width in pixels).
  shake_min_edge_width: 1.3
  # Rough fallback when no fine-detail measurement is possible (0 = none, 1 = extreme).
  shake_limit: 0.55

  # Below this resolution (megapixels) an image is too small for wall art.
  wallart_min_megapixels: 8
  # Print resolution used for the maximum wall-art size.
  print_dpi: 200

  # Weights of the partial scores in the quality score.
  weights:
    sharpness: 0.40
    exposure: 0.25
    noise: 0.15
    shake: 0.10
    resolution: 0.10

duplicates:
  # Hamming distance of the perceptual hashes (0 = identical, 64 = completely different).
  # Duplicate = practically the same image (copy, same shot). Only one of them stays.
  duplicate_distance: 2
  burst_distance: 12
  # Images of a burst must be taken within this many seconds.
  # Without a capture time only the (stricter) duplicate distance counts.
  burst_seconds: 30
  # Up to this many images of a burst are kept if they are really good. The best one always stays.
  burst_keep: 3
  # "Really good" means at least this quality score and no clear flaw.
  burst_good_from: 0.75
  # Burst shots at most this much worse than the best one go to "Review" instead of "Reject".
  burst_tolerance: 0.03

classification:
  # Strictness from 0.0 (very lenient) to 1.0 (very strict). 0.5 = normal.
  strictness: 0.5
  # From this quality score an image is a highlight candidate ...
  highlight_from: 0.80
  # ... but only among this best share of all images (0.15 = best 15%).
  highlight_top_share: 0.15
  # An image with a clear flaw (one partial score below this) goes at least to "Review".
  flaw_below: 0.5
  # Below this quality score: "Review".
  review_below: 0.45
  # Below this quality score: failed shot, rejected (only while there is no value score).
  reject_below: 0.15
  # Value score from here on = "high value".
  value_high_from: 0.5

learning:
  # From this many ratings (and at least min_per_side on each side) a model is trained.
  min_ratings: 40
  min_per_side: 10
  # Learn from the ratings of ALL your photo folders (kept on the PC), so a new folder is sorted by your taste
  # right away. false = every folder only learns from its own ratings.
  shared: true
  # Retrain automatically after this many new ratings.
  retrain_every: 10
  # Regularization strength (higher = more cautious model).
  regularization: 3.0
  # Share of random images in active learning (the rest: least certain images first).
  random_share: 0.25
  # Classification by your model's prediction (probability of "keep"):
  reject_below: 0.15
  review_below: 0.45
  highlight_from: 0.80
  # Burst shots from this prediction count as "really good".
  burst_good_from: 0.65

ai:
  # Pretrained AI models (set up by the installer, or in the app: "Set up AI"). false = off.
  enabled: true
  # auto = graphics card if available, otherwise CPU. Alternatively: cuda or cpu.
  device: auto
  clip_model: ViT-L-14
  clip_weights: openai
  # Extra models from the pyiqa library (optional, empty list = off).
  pyiqa_models: [musiq, nima]
  # Images per batch on the graphics card.
  batch_size: 16
  # Folder with reference images (images you consider great wall art). Relative to your data
  # folder (%LOCALAPPDATA%\WallyCull) or a full path. Empty = no references.
  references_folder: references
  # How the value score is put together while your personal model is not trained yet.
  value_weights:
    aesthetic: 0.35
    wallart: 0.25
    reference: 0.25
    content: 0.10
    nima: 0.05

numbers:
  # Read the start number on the car and look up driver and team in the entry lists (after the AI step).
  enabled: true
  # Which entry lists to use (file names without .csv, from wallycull\series and
  # %LOCALAPPDATA%\WallyCull\series). Empty = all.
  series: []
  # Only numbers read at least this confidently count (0..1).
  min_confidence: 0.5
