# Builds WallyCull-Setup-<version>.exe and publishes it as a release whenever __version__ goes up.
# The installed app looks for the newest release at start and installs it by itself.
name: Build setup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setup
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.10"
  RCEDIT_URL: https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path wallycull/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0 -and "${{ github.event_name }}" -ne "workflow_dispatch") { "build=false" >> $env:GITHUB_OUTPUT } else { "build=true" >> $env:GITHUB_OUTPUT }
          Write-Host "Version $v"
          $global:LASTEXITCODE = 0

      - name: Write build info
        if: steps.v.outputs.build == 'true'
        shell: pwsh
        run: |
          # The repo id keeps updates working even if the repository is renamed
          '{"repo_id": ${{ github.repository_id }}, "repo": "${{ github.repository }}"}' | Set-Content -Encoding utf8NoBOM wallycull/build.json
          Get-Content wallycull/build.json

      - name: Bundle Python
        if: steps.v.outputs.build == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/python/$env:PYTHON_VERSION" -OutFile python.zip
          Expand-Archive python.zip -DestinationPath nuget
          New-Item -ItemType Directory -Force build | Out-Null
          Move-Item nuget/tools build/python
          $py = "build/python/python.exe"
          & $py -m pip --version
          if ($LASTEXITCODE -ne 0) { & $py -m ensurepip --upgrade }
          & $py -m pip install --upgrade --no-warn-script-location pip
          & $py -m pip install --no-warn-script-location -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          & $py -c "import cv2, numpy, rawpy, PIL, imagehash, yaml, send2trash, psutil, webview; print('packages ok')"
          if ($LASTEXITCODE -ne 0) { throw "import test failed" }
          # Self-test: the package loads and the command line answers
          & $py -m wallycull --version
          if ($LASTEXITCODE -ne 0) { throw "wallycull does not start" }
          Get-ChildItem build/python -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - name: Create WallyCull.exe with icon
        if: steps.v.outputs.build == 'true'
        shell: pwsh
        run: |
          Copy-Item build/python/pythonw.exe build/python/WallyCull.exe
          Invoke-WebRequest $env:RCEDIT_URL -OutFile rcedit.exe
          ./rcedit.exe build/python/WallyCull.exe --set-icon wallycull/icon.ico `
            --set-version-string FileDescription WallyCull --set-version-string ProductName WallyCull `
            --set-version-string CompanyName WallyFrame --set-file-version "${{ steps.v.outputs.version }}" `
            --set-product-version "${{ steps.v.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed" }

      - name: Compile setup
        if: steps.v.outputs.build == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=${{ steps.v.outputs.version }}" installer/WallyCull.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Test silent install
        if: steps.v.outputs.build == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*.exe | Select-Object -First 1
          # Skip the AI step in the test: no GPU download on the build machine
          $env:WALLYCULL_SKIP_AI = "1"
          # Wait for the setup only: -Wait would also wait for the app the setup starts at the end
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=","/LOG=install.log" -PassThru
          if (-not $p.WaitForExit(900000)) { Get-Content install.log -Tail 40; throw "setup did not finish" }
          $app = "$env:LOCALAPPDATA\Programs\WallyCull"
          if (-not (Test-Path "$app\python\WallyCull.exe")) { Get-Content install.log -Tail 40; throw "installation failed" }
          Push-Location $app
          & "$app\python\python.exe" -m wallycull --version
          if ($LASTEXITCODE -ne 0) { throw "installed app does not start" }
          Pop-Location
          # The setup starts the app at the end: its local server should answer
          $state = $null
          foreach ($i in 1..30) {
            try { $state = Invoke-RestMethod http://127.0.0.1:8765/api/state -TimeoutSec 2; break } catch { Start-Sleep 2 }
          }
          if ($state) { Write-Host "App answered: version $($state.version)" }
          else { Write-Host "::warning::The installed app did not answer (no desktop session on the build machine?)"; Get-Content "$env:LOCALAPPDATA\WallyCull\app.log" -ErrorAction SilentlyContinue }
          Get-Process WallyCull -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Publish release
        if: steps.v.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $file = "dist/WallyCull-Setup-$v.exe"
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" $file --clobber
          } else {
            # Release notes: this version's section of CHANGELOG.md
            $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$v*" } | Select-Object -First 1
            if (-not $notes) { $notes = "WallyCull $v" } else { $notes = ($notes -split "`n", 2)[1].Trim() }
            gh release create "v$v" $file --title "WallyCull $v" --notes "$notes" --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "release failed" }
